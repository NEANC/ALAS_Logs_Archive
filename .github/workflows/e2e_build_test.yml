name: E2E Build Test

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

permissions:
  contents: read
  actions: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  e2e-exe-nuitka:
    name: "EXE-Nuitka (windows)"
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # 检查当前 Python 版本
      - name: Check Python
        id: check_python
        shell: bash
        run: |
          PYTHON_VERSION=$(python --version 2>&1 || python3 --version 2>&1)
          echo "Detected Python version: $PYTHON_VERSION"
          
          if echo "$PYTHON_VERSION" | grep -i "python 3\.12"; then
            echo "python_version=3.12" >> $GITHUB_OUTPUT
            echo "skip_setup=true" >> $GITHUB_OUTPUT
          else
            echo "skip_setup=false" >> $GITHUB_OUTPUT
          fi

      # 设置 Python 环境（仅当版本不是 3.12 时）
      - name: Setup Python
        if: steps.check_python.outputs.skip_setup != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-py3.12-
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Python deps (for test helper)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all artifacts from build workflow
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Locate Nuitka EXE
        shell: powershell
        run: |
          Write-Host "=== Available files ==="
          Get-ChildItem -Recurse | ForEach-Object { Write-Host $_.FullName }
          $exe = Get-ChildItem -Recurse -Filter "ALAS_Logs_Archive.exe" |
                 Where-Object { $_.DirectoryName -match "Nuitka" } |
                 Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Recurse -Filter "ALAS_Logs_Archive.exe" | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Error "Nuitka: 未找到 ALAS_Logs_Archive.exe"
            exit 1
          }
          Write-Host "EXE: $($exe.FullName)"
          "CI_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare temp directories
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ci_target_$(Get-Random)"
          $archive = Join-Path $env:RUNNER_TEMP "ci_archive_$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $target, $archive | Out-Null
          "CI_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CI_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run E2E exe mode (Nuitka)
        shell: powershell
        run: |
          python tests/ci_e2e_helper.py `
            --mode exe `
            --exe "$env:CI_EXE" `
            --target "$env:CI_TARGET" `
            --archive "$env:CI_ARCHIVE"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-exe-nuitka-logs
          path: |
            logs/*.log
          retention-days: 3

  e2e-exe-pyinstaller:
    name: "EXE-PyInstaller (windows)"
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # 检查当前 Python 版本
      - name: Check Python
        id: check_python
        shell: bash
        run: |
          PYTHON_VERSION=$(python --version 2>&1 || python3 --version 2>&1)
          echo "Detected Python version: $PYTHON_VERSION"
          
          if echo "$PYTHON_VERSION" | grep -i "python 3\.12"; then
            echo "python_version=3.12" >> $GITHUB_OUTPUT
            echo "skip_setup=true" >> $GITHUB_OUTPUT
          else
            echo "skip_setup=false" >> $GITHUB_OUTPUT
          fi

      # 设置 Python 环境（仅当版本不是 3.12 时）
      - name: Setup Python
        if: steps.check_python.outputs.skip_setup != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-py3.12-
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Python deps (for test helper)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all artifacts from build workflow
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Locate PyInstaller EXE
        shell: powershell
        run: |
          Write-Host "=== Available files ==="
          Get-ChildItem -Recurse | ForEach-Object { Write-Host $_.FullName }
          $exe = Get-ChildItem -Recurse -Filter "ALAS_Logs_Archive.exe" |
                 Where-Object { $_.DirectoryName -match "PyInstaller" } |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "PyInstaller: 未找到 ALAS_Logs_Archive.exe"
            exit 1
          }
          Write-Host "EXE: $($exe.FullName)"
          "CI_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare temp directories
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ci_target_$(Get-Random)"
          $archive = Join-Path $env:RUNNER_TEMP "ci_archive_$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $target, $archive | Out-Null
          "CI_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CI_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run E2E exe mode (PyInstaller)
        shell: powershell
        run: |
          python tests/ci_e2e_helper.py `
            --mode exe `
            --exe "$env:CI_EXE" `
            --target "$env:CI_TARGET" `
            --archive "$env:CI_ARCHIVE"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-exe-pyinstaller-logs
          path: |
            logs/*.log
          retention-days: 3
