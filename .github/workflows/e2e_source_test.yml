name: E2E Source Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  e2e-source:
    name: "Source (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      # 检查当前 Python 版本
      - name: Check Python
        id: check_python
        shell: bash
        run: |
          PYTHON_VERSION=$(python --version 2>&1 || python3 --version 2>&1)
          echo "Detected Python version: $PYTHON_VERSION"

          if echo "$PYTHON_VERSION" | grep -i "python 3\.12"; then
            echo "python_version=3.12" >> $GITHUB_OUTPUT
            echo "skip_setup=true" >> $GITHUB_OUTPUT
          else
            echo "skip_setup=false" >> $GITHUB_OUTPUT
          fi

      # 设置 Python 环境（仅当版本不是 3.12 时）
      - name: Setup Python
        if: steps.check_python.outputs.skip_setup != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py${{ steps.check_python.outputs.python_version || '3.12' }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-py${{ steps.check_python.outputs.python_version || '3.12' }}-
            pip-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare temp directories
        shell: bash
        run: |
          echo "CI_TARGET=$(mktemp -d)" >> $GITHUB_ENV
          echo "CI_ARCHIVE=$(mktemp -d)" >> $GITHUB_ENV

      - name: Run E2E source mode
        shell: bash
        run: |
          python tests/ci_e2e_helper.py \
            --mode source \
            --target "$CI_TARGET" \
            --archive "$CI_ARCHIVE"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-source-${{ matrix.os }}-logs
          path: |
            logs/*.log
          retention-days: 3
